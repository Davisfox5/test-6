<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameTape - Sports Video Tagging</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ── Project List Screen ──────────────────────────────────────────── -->
<div id="project-list-screen" class="screen active">
  <header>
    <h1>GameTape</h1>
    <p class="subtitle">Sports Video Tagging</p>
  </header>
  <div class="project-controls">
    <input type="text" id="new-project-name" placeholder="New project name...">
    <button id="btn-create-project">+ New Project</button>
  </div>
  <div id="projects-container"></div>
</div>

<!-- ── Tagging Screen ───────────────────────────────────────────────── -->
<div id="tagging-screen" class="screen">
  <nav class="top-bar">
    <button id="btn-back">&larr; Projects</button>
    <h2 id="project-title"></h2>
    <button id="btn-manage-players">Players</button>
    <button id="btn-manage-tags">Manage Tag Types</button>
  </nav>

  <div class="main-layout">
    <!-- Left: Video + Controls -->
    <div class="video-panel">
      <div class="video-wrapper">
        <div id="no-video-msg" class="placeholder-msg">
          <p>No video loaded. Upload a game video to get started.</p>
          <label class="upload-btn">
            Choose Video
            <input type="file" id="video-upload" accept="video/*" hidden>
          </label>
        </div>
        <video id="game-video" controls></video>
      </div>

      <!-- Tagging controls -->
      <div class="tag-controls">
        <div class="mark-row">
          <button id="btn-mark-in" class="mark-btn">Mark IN</button>
          <span id="mark-in-display" class="time-display">--:--</span>
          <button id="btn-mark-out" class="mark-btn">Mark OUT</button>
          <span id="mark-out-display" class="time-display">--:--</span>
        </div>
        <div class="tag-row">
          <select id="clip-tag-type"></select>
          <input type="text" id="clip-label" placeholder="Label (optional)">
          <button id="btn-save-clip" class="save-btn">Save Clip</button>
        </div>
        <div class="tag-row">
          <input type="text" id="clip-notes" placeholder="Notes (optional)" style="flex:1">
        </div>
        <div class="tag-row players-row">
          <label class="players-label">Players:</label>
          <div id="player-checkboxes" class="player-checkboxes"></div>
        </div>
      </div>

      <!-- Timeline -->
      <div class="timeline-container">
        <div id="timeline" class="timeline">
          <div id="timeline-playhead" class="playhead"></div>
        </div>
      </div>
    </div>

    <!-- Right: Clip list + filters -->
    <div class="clips-panel">
      <h3>Clips</h3>
      <div class="filter-bar">
        <label>Filter:</label>
        <select id="filter-tag-type">
          <option value="">All Types</option>
        </select>
        <select id="filter-player">
          <option value="">All Players</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search labels...">
      </div>
      <div id="clips-list"></div>
      <div class="clip-count"><span id="clip-count-num">0</span> clips</div>
    </div>
  </div>
</div>

<!-- ── Tag Type Manager Modal ───────────────────────────────────────── -->
<div id="tag-modal" class="modal-overlay">
  <div class="modal">
    <h3>Manage Tag Types</h3>
    <div id="tag-type-list"></div>
    <div class="add-tag-row">
      <input type="text" id="new-tag-name" placeholder="New tag name">
      <input type="color" id="new-tag-color" value="#e74c3c">
      <button id="btn-add-tag-type">Add</button>
    </div>
    <button id="btn-close-modal" class="close-modal-btn">Done</button>
  </div>
</div>

<!-- ── Player Manager Modal ──────────────────────────────────────────── -->
<div id="player-modal" class="modal-overlay">
  <div class="modal">
    <h3>Manage Players</h3>
    <div id="player-list"></div>
    <div class="add-tag-row">
      <input type="text" id="new-player-number" placeholder="#" style="flex:0 0 50px">
      <input type="text" id="new-player-name" placeholder="Player name">
      <button id="btn-add-player">Add</button>
    </div>
    <button id="btn-close-player-modal" class="close-modal-btn">Done</button>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
